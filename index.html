<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; connect-src 'self' https://0.peerjs.com wss://0.peerjs.com https://api.open-meteo.com https://geocoding-api.open-meteo.com">
  <title>말랑이 키우기</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <canvas id="scene"></canvas>
  <div id="toasts"></div>

  <!-- 말랑이를 클릭하면 머리 위에 뜨는 돌봄 카드 -->
  <div id="card" class="ui box" hidden>
    <div class="head">
      <span id="pName"></span>
      <span id="pStage" class="tag"></span>
      <span class="spacer"></span>
      <button id="editBtn" class="link">수정</button>
      <button id="closeCard" class="link">닫기</button>
    </div>
    <div class="meta"><span id="pAge"></span><span id="pStatus"></span></div>

    <div class="stats">
      <div class="stat"><span>배부름</span><div class="gauge" data-stat="hunger"></div></div>
      <div class="stat"><span>기분</span><div class="gauge" data-stat="happy"></div></div>
      <div class="stat"><span>청결</span><div class="gauge" data-stat="clean"></div></div>
      <div class="stat"><span>기운</span><div class="gauge" data-stat="energy"></div></div>
    </div>

    <div class="actions">
      <button class="btn" data-act="feed"><canvas class="ico" data-icon="onigiri"></canvas><span>밥</span></button>
      <button class="btn" data-act="play"><canvas class="ico" data-icon="ball"></canvas><span>놀기</span></button>
      <button class="btn" data-act="clean"><canvas class="ico" data-icon="drop"></canvas><span>씻기</span></button>
      <button class="btn" data-act="sleep"><canvas class="ico" id="sleepIcon" data-icon="moon"></canvas><span id="sleepLabel">재우기</span></button>
      <button class="btn" data-act="medicine"><canvas class="ico" data-icon="pill"></canvas><span>약</span></button>
    </div>
  </div>

  <!-- 말랑이네 표지를 클릭하면 뜨는 작은 집 창 -->
  <div id="home" class="ui box" hidden>
    <div id="homeBar" class="titlebar">
      <canvas class="ico" data-icon="twin"></canvas>
      <span class="name">말랑이네</span>
      <span id="homeCount" class="sub"></span>
      <span class="spacer"></span>
      <button id="homeClose" class="link">닫기</button>
    </div>
    <canvas id="room" width="276" height="150"></canvas>
    <div class="weather">
      <span id="wLine"></span>
      <button id="wPlace" class="link">지역</button>
    </div>
    <div id="wEdit" class="row" hidden>
      <input id="wCity" class="input" maxlength="30" placeholder="도시 이름 (예: 부산, Tokyo)" autocomplete="off">
      <button id="wOk" class="btn small">확인</button>
    </div>
    <div class="home-actions">
      <button class="btn" id="hAdopt">입양</button>
      <button class="btn" id="hGather">모두 부르기</button>
      <button class="btn" id="hTheme"></button>
    </div>
    <div class="home-actions">
      <button class="btn" id="hLock"></button>
      <button class="btn" id="hHide">표지 숨기기</button>
      <button class="btn warn" id="hQuit" title="말랑이 키우기를 꺼요 (바탕화면 바로가기로 다시 켤 수 있어요)">끄기</button>
    </div>
    <div class="home-actions">
      <button class="btn" id="hFriends"><canvas class="ico" data-icon="letter"></canvas><span>친구 · 쪽지</span></button>
      <button class="btn" id="hFocus"><canvas class="ico" data-icon="focus"></canvas><span id="hFocusLabel">집중 모드</span></button>
    </div>
  </div>

  <!-- 친구에게 말랑이로 쪽지 보내기 (둘 다 켜져 있을 때 P2P로 전해진다) -->
  <div id="friends" class="ui box" hidden>
    <div id="friendsBar" class="titlebar">
      <canvas class="ico" data-icon="letter"></canvas>
      <span class="name">친구</span>
      <span id="netState" class="sub"></span>
      <span class="spacer"></span>
      <button id="friendsClose" class="link">닫기</button>
    </div>
    <div class="field first">
      <span>내 친구 코드 — 친구에게 알려 주세요</span>
      <div class="row">
        <span id="myCode" class="code"></span>
        <button id="copyCode" class="btn small">복사</button>
      </div>
    </div>
    <label class="field">
      <span>내 이름</span>
      <input id="fNick" class="input" maxlength="10" autocomplete="off">
    </label>
    <div class="field">
      <span>친구 추가</span>
      <div class="row">
        <input id="fCode" class="input" maxlength="9" placeholder="ABCD-1234" autocomplete="off">
        <button id="fAdd" class="btn small">추가</button>
      </div>
    </div>
    <div id="fList"></div>
    <div class="field">
      <div class="row">
        <span id="fTo" class="spacer">대화할 친구를 골라 주세요</span>
        <button id="fShake" class="btn small" title="친구 바탕화면의 말랑이를 흔들어요">흔들기</button>
      </div>
      <div id="fLog"></div>
      <div id="fAttach" class="row" hidden>
        <img id="fAttachImg" alt="보낼 사진">
        <span class="spacer">사진을 같이 보내요</span>
        <button id="fAttachDel" class="link warn">빼기</button>
      </div>
      <div class="row">
        <input id="fMsg" class="input" maxlength="40" placeholder="말랑이가 전해 줄 쪽지" autocomplete="off">
        <button id="fPhoto" class="btn small" title="사진 보내기 (붙여넣기도 돼요)"><canvas class="ico" data-icon="photo"></canvas></button>
        <input type="file" id="fFile" accept="image/*" hidden>
        <button id="fSend" class="btn small primary">보내기</button>
      </div>
    </div>
  </div>

  <div id="modal" hidden>
    <div class="sheet ui box">
      <div id="mTitle" class="title"></div>
      <canvas id="mPreview" width="176" height="128"></canvas>
      <label class="field">
        <span>이름</span>
        <div class="row">
          <input id="mName" maxlength="10" autocomplete="off">
          <button id="mDice" class="btn small">추천</button>
        </div>
      </label>
      <div class="field">
        <span>새싹 모양</span>
        <div class="row" id="mSprouts">
          <button class="btn sprout" data-sprout="twin"><canvas class="ico" data-icon="twin"></canvas><span>떡잎</span></button>
          <button class="btn sprout" data-sprout="single"><canvas class="ico" data-icon="single"></canvas><span>외잎</span></button>
          <button class="btn sprout" data-sprout="flower"><canvas class="ico" data-icon="flower"></canvas><span>꽃봉오리</span></button>
        </div>
      </div>
      <div class="field">
        <span>색깔</span>
        <div class="row" id="mColors">
          <button class="swatch" data-color="" title="기본"></button>
          <button class="swatch" data-color="#F2A7B8" title="딸기"></button>
          <button class="swatch" data-color="#F4A96A" title="귤"></button>
          <button class="swatch" data-color="#F3D36B" title="바나나"></button>
          <button class="swatch" data-color="#8FD9C0" title="민트"></button>
          <button class="swatch" data-color="#8EC5E8" title="소다"></button>
          <button class="swatch" data-color="#B9A3E3" title="포도"></button>
          <label class="swatch custom" title="직접 고르기"><input type="color" id="mColorPick"></label>
        </div>
      </div>
      <div class="row buttons">
        <button id="mFarewell" class="link warn">작별하기</button>
        <span class="spacer"></span>
        <button id="mCancel" class="btn">취소</button>
        <button id="mOk" class="btn primary">입양하기</button>
      </div>
    </div>
  </div>

  <script src="vendor/peerjs.min.js"></script>
  <script src="renderer.js"></script>
</body>
</html>
